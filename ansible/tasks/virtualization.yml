---
# ---------------------------------------------------------------------------
# Libvirt / QEMU
# ---------------------------------------------------------------------------

- name: Install virtualization packages
  ansible.builtin.package:
    name:
      - qemu-desktop
      - libvirt
      - virt-manager
      - virt-install
      - dnsmasq
      - edk2-ovmf
      - swtpm
    state: present
  when: libvirt_enabled | bool


- name: Enable libvirt
  ansible.builtin.systemd_service:
    name: libvirtd.service
    enabled: true
    state: started
  when: libvirt_enabled | bool


# ---------------------------------------------------------------------------
# Podman
# ---------------------------------------------------------------------------

- name: Install Podman
  ansible.builtin.package:
    name: podman
    state: present
  when: podman_enabled | bool


- name: Install Docker compatibility for Podman
  ansible.builtin.package:
    name: podman-docker
    state: present
  when:
    - podman_enabled | bool
    - podman_docker_compat | bool


# ---------------------------------------------------------------------------
# User groups
# ---------------------------------------------------------------------------
- name: Build effective user groups
  ansible.builtin.set_fact:
    effective_user_groups: "{{ (user_groups + [libvirt_group_name]) | unique }}"

- name: Add user to configured groups
  ansible.builtin.user:
    name: "{{ username }}"
    groups: "{{ effective_user_groups }}"
    append: true
    
- name: Detect libvirt group
  ansible.builtin.shell:
    cmd: |
      for group in libvirt libvirtd; do
        if getent group "$group" >/dev/null; then
          printf '%s\n' "$group"
          exit 0
        fi
      done
      exit 1
  register: detected_libvirt_group
  changed_when: false
  failed_when: false
  when: libvirt_enabled | bool

- name: Add user to detected libvirt group
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - "{{ detected_libvirt_group.stdout }}"
    append: true
  when:
    - libvirt_enabled | bool
    - detected_libvirt_group.rc == 0
