---
# ---------------------------------------------------------------------------
# Libvirt / QEMU
# ---------------------------------------------------------------------------

- name: Install virtualization packages
  ansible.builtin.package:
    name:
      - qemu-desktop
      - libvirt
      - virt-manager
      - virt-install
      - dnsmasq
      - edk2-ovmf
      - swtpm
    state: present
  when: libvirt_enabled | bool


- name: Enable libvirt
  ansible.builtin.systemd_service:
    name: libvirtd.service
    enabled: true
    state: started
  when: libvirt_enabled | bool


# ---------------------------------------------------------------------------
# Podman
# ---------------------------------------------------------------------------

- name: Install Podman
  ansible.builtin.package:
    name: podman
    state: present
  when: podman_enabled | bool


- name: Install Docker compatibility for Podman
  ansible.builtin.package:
    name: podman-docker
    state: present
  when:
    - podman_enabled | bool
    - podman_docker_compat | bool


# ---------------------------------------------------------------------------
# User groups
# ---------------------------------------------------------------------------

- name: Detect libvirt-compatible group names
  ansible.builtin.command:
    cmd: "getent group {{ item }}"
  loop: "{{ libvirt_group_candidates }}"
  register: libvirt_group_detect
  changed_when: false
  failed_when: false

- name: Select libvirt group name
  ansible.builtin.set_fact:
    libvirt_group_name: >-
      {{
        (libvirt_group_detect.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list | first)
        | default(libvirt_group_candidates[0])
      }}

- name: Build effective user groups
  ansible.builtin.set_fact:
    effective_user_groups: "{{ (user_groups + extra_user_groups + [libvirt_group_name]) | unique }}"

- name: Ensure configured user groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ effective_user_groups }}"


- name: Add user to configured groups
  ansible.builtin.user:
    name: "{{ username }}"
    groups: "{{ effective_user_groups }}"
    append: true
