---
# ---------------------------------------------------------------------------
# Optional/required AUR handling
# ---------------------------------------------------------------------------

- name: Build required AUR package list
  ansible.builtin.set_fact:
    effective_aur_required_packages: >-
      {{
        (
          (
            aur_required_packages
            if noctalia_greeter_enabled | bool
            else (aur_required_packages | difference(['noctalia-greeter']))
          )
        ) | unique
      }}
    effective_aur_optional_packages: >-
      {{
        (
          aur_optional_packages
          + (nix_compat_aur_packages if nix_compat_enabled | bool else [])
        ) | unique
      }}

- name: Build complete AUR package list
  ansible.builtin.set_fact:
    effective_aur_all_packages: "{{ (effective_aur_required_packages + effective_aur_optional_packages) | unique }}"

# ---------------------------------------------------------------------------
# AUR helper
# ---------------------------------------------------------------------------

- name: Check AUR helper
  ansible.builtin.command:
    cmd: "command -v {{ aur_helper }}"
  register: aur_helper_check
  changed_when: false
  failed_when: false
  become: false
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0

- name: Install AUR helper build dependencies
  ansible.builtin.package:
    name:
      - base-devel
      - git
      - go
    state: present
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper_check.rc != 0

- name: Create AUR build directory
  ansible.builtin.file:
    path: "/tmp/{{ aur_helper }}-build"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper_check.rc != 0

- name: Clone yay from AUR
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: "/tmp/{{ aur_helper }}-build/yay"
    version: master
  become: true
  become_user: "{{ username }}"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0

- name: Build yay package as user
  ansible.builtin.command:
    cmd: makepkg -f --noconfirm
    chdir: "/tmp/{{ aur_helper }}-build/yay"
  become: true
  become_user: "{{ username }}"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0

- name: Find built yay package
  ansible.builtin.find:
    paths: "/tmp/{{ aur_helper }}-build/yay"
    patterns:
      - "yay-[0-9]*.pkg.tar.zst"
    file_type: file
  register: yay_package
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0

- name: Install yay package
  ansible.builtin.command:
    cmd: "pacman -U --noconfirm {{ yay_package.files[0].path }}"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0
    - yay_package.files | length > 0

- name: Build yay package as user
  ansible.builtin.command:
    cmd: makepkg -f --noconfirm
    chdir: "/tmp/{{ aur_helper }}-build/yay"
  become: true
  become_user: "{{ username }}"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0

- name: Find built yay package
  ansible.builtin.find:
    paths: "/tmp/{{ aur_helper }}-build/yay"
    patterns:
      - "yay-[0-9]*.pkg.tar.zst"
    file_type: file
  register: yay_package
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0

- name: Install yay package
  ansible.builtin.command:
    cmd: "pacman -U --noconfirm {{ yay_package.files[0].path }}"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0
    - aur_helper == "yay"
    - aur_helper_check.rc != 0
    - yay_package.files | length > 0

# ---------------------------------------------------------------------------
# Allow yay to invoke pacman non-interactively
# ---------------------------------------------------------------------------

- name: Allow AUR user to run pacman without password temporarily
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-aur-yay
    owner: root
    group: root
    mode: "0440"
    content: |
      {{ username }} ALL=(root) NOPASSWD: /usr/bin/pacman
    validate: "/usr/bin/visudo -cf %s"
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0

# ---------------------------------------------------------------------------
# Required AUR packages
# ---------------------------------------------------------------------------

- name: Install required AUR packages as user
  ansible.builtin.command:
    cmd: >-
      {{ aur_helper }} -S --needed --noconfirm
      --answerclean None
      --answerdiff None
      {{ effective_aur_required_packages | join(' ') }}
  become: true
  become_user: "{{ username }}"
  register: aur_required_install_result
  changed_when: >-
    'there is nothing to do' not in
    (
      (aur_required_install_result.stdout | default(''))
      +
      (aur_required_install_result.stderr | default(''))
    )
  when:
    - aur_install_enabled | bool
    - effective_aur_required_packages | length > 0

# ---------------------------------------------------------------------------
# Optional AUR packages
# ---------------------------------------------------------------------------

- name: Install optional AUR packages as user
  ansible.builtin.command:
    cmd: >-
      {{ aur_helper }} -S --needed --noconfirm
      --answerclean None
      --answerdiff None
      {{ effective_aur_optional_packages | join(' ') }}
  become: true
  become_user: "{{ username }}"
  register: aur_optional_install_result
  changed_when: >-
    'there is nothing to do' not in
    (
      (aur_optional_install_result.stdout | default(''))
      +
      (aur_optional_install_result.stderr | default(''))
    )
  failed_when: false
  when:
    - aur_install_enabled | bool
    - effective_aur_optional_packages | length > 0

- name: Warn when optional AUR packages fail
  ansible.builtin.debug:
    msg:
      - "Algunos paquetes AUR opcionales no se pudieron instalar."
      - "stdout: {{ aur_optional_install_result.stdout | default('') }}"
      - "stderr: {{ aur_optional_install_result.stderr | default('') }}"
  when:
    - aur_install_enabled | bool
    - effective_aur_optional_packages | length > 0
    - aur_optional_install_result.rc != 0

# ---------------------------------------------------------------------------
# Remove temporary sudo permission
# ---------------------------------------------------------------------------

- name: Remove temporary AUR pacman sudo permission
  ansible.builtin.file:
    path: /etc/sudoers.d/90-aur-yay
    state: absent
  when:
    - aur_install_enabled | bool
    - effective_aur_all_packages | length > 0

- name: Build missing required AUR package list
  ansible.builtin.set_fact:
    missing_required_aur_packages: >-
      {{
        aur_required_presence.results
        | default([])
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}
  when:
    - not (aur_install_enabled | bool)
    - effective_aur_required_packages | length > 0

- name: Fail when required AUR packages are missing and auto-install is disabled
  ansible.builtin.assert:
    that:
      - (missing_required_aur_packages | default([])) | length == 0
    fail_msg: >-
      Faltan paquetes AUR requeridos: {{ missing_required_aur_packages | join(', ') }}.
      Con aur_install_enabled=false debes preinstalarlos manualmente.
      Alternativamente activa aur_install_enabled=true para instalación automática
      (siempre como {{ username }}, nunca como root).
  when:
    - not (aur_install_enabled | bool)
    - effective_aur_required_packages | length > 0

- name: Inform optional AUR packages when auto-install is disabled
  ansible.builtin.debug:
    msg:
      - "Paquetes AUR opcionales pendientes (instalación automática desactivada):"
      - "{{ effective_aur_optional_packages }}"
      - "Para automatizar, activa aur_install_enabled=true y configura aur_helper."
  when:
    - not (aur_install_enabled | bool)
    - effective_aur_optional_packages | length > 0
