---
# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------

- name: Install networking packages
  ansible.builtin.package:
    name:
      - networkmanager
      - network-manager-applet
      - avahi
      - nss-mdns
      - nftables
    state: present


# ---------------------------------------------------------------------------
# NetworkManager
# ---------------------------------------------------------------------------

- name: Enable NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: started
  when: networkmanager_enabled | bool


# ---------------------------------------------------------------------------
# SSH
# ---------------------------------------------------------------------------

- name: Install OpenSSH package
  ansible.builtin.package:
    name: openssh
    state: present
  when: ssh_enabled | bool

- name: Enable SSH
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: true
    state: started
  when: ssh_enabled | bool

- name: Disable SSH by default
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: false
    state: stopped
  when: not (ssh_enabled | bool)


# ---------------------------------------------------------------------------
# Avahi
# ---------------------------------------------------------------------------

- name: Configure mDNS NSS
  ansible.builtin.replace:
    path: /etc/nsswitch.conf
    regexp: '^hosts:(?!.*\bmdns4\b)(.*)$'
    replace: 'hosts:\1 mdns4'
  notify:
    - Restart Avahi


- name: Enable Avahi
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    state: started


# ---------------------------------------------------------------------------
# Bluetooth
# ---------------------------------------------------------------------------

- name: Install Bluetooth packages
  ansible.builtin.package:
    name:
      - bluez
      - bluez-utils
    state: present
  when: bluetooth_enabled | bool


- name: Configure Bluetooth auto-enable
  ansible.builtin.blockinfile:
    path: /etc/bluetooth/main.conf
    marker: "# {mark} ARCH-CONFIG BLUETOOTH"
    block: |
      [Policy]
      AutoEnable={{ "true" if bluetooth_power_on_boot else "false" }}
  when: bluetooth_enabled | bool


- name: Enable Bluetooth
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true
    state: started
  when: bluetooth_enabled | bool


# ---------------------------------------------------------------------------
# Firewall
# ---------------------------------------------------------------------------

- name: Configure nftables
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      #!/usr/bin/nft -f

      flush ruleset

      table inet filter {
        chain input {
          type filter hook input priority 0;
          policy drop;

          iifname "lo" accept

          ct state invalid drop
          ct state established,related accept

          ip protocol icmp accept
          ip6 nexthdr icmpv6 accept

          udp sport 67 udp dport 68 accept

          # Avahi / mDNS
          udp dport 5353 accept

          {% if firewall_tcp_ports | length > 0 %}
          tcp dport {
          {% for port in firewall_tcp_ports %}
            {{ port }}{% if not loop.last %},{% endif %}
          {% endfor %}
          } accept
          {% endif %}

          {% if firewall_udp_ports | length > 0 %}
          udp dport {
          {% for port in firewall_udp_ports %}
            {{ port }}{% if not loop.last %},{% endif %}
          {% endfor %}
          } accept
          {% endif %}
        }

        chain forward {
          type filter hook forward priority 0;
          policy accept;
        }

        chain output {
          type filter hook output priority 0;
          policy accept;
        }
      }
  when: firewall_enabled | bool
  notify:
    - Reload nftables


- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
    state: started
  when: firewall_enabled | bool


# ---------------------------------------------------------------------------
# User network groups
# ---------------------------------------------------------------------------

- name: Add user to Wireshark group
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - wireshark
    append: true
