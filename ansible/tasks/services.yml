---
# ---------------------------------------------------------------------------
# System packages
# ---------------------------------------------------------------------------

- name: Install service packages
  ansible.builtin.package:
    name:
      - fwupd
      - power-profiles-daemon
      - cups
      - cups-filters
      - cups-browsed
      - dbus
      - flatpak
      - gvfs
      - gvfs-mtp
      - udisks2
      - upower
      - gnome-keyring
      - rtkit
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
      - pipewire-jack
      - wireplumber
    state: present


# ---------------------------------------------------------------------------
# Power
# ---------------------------------------------------------------------------

- name: Enable power-profiles-daemon
  ansible.builtin.systemd_service:
    name: power-profiles-daemon.service
    enabled: true
    state: started
  when: power_profiles_enabled | bool

- name: Enable fwupd
  ansible.builtin.systemd_service:
    name: fwupd.service
    enabled: true
    state: started
  when: fwupd_enabled | bool

- name: Enable rtkit daemon
  ansible.builtin.systemd_service:
    name: rtkit-daemon.service
    enabled: true
    state: started
  when: rtkit_enabled | bool

- name: Install optional PulseAudio compatibility package
  ansible.builtin.package:
    name: pulseaudio
    state: present
  when: pulseaudio_compat_enabled | bool


# ---------------------------------------------------------------------------
# Printing
# ---------------------------------------------------------------------------

- name: Enable CUPS
  ansible.builtin.systemd_service:
    name: cups.service
    enabled: true
    state: started
  when: printing_enabled | bool


# ---------------------------------------------------------------------------
# PipeWire user services
# ---------------------------------------------------------------------------

- name: Enable PipeWire user service globally
  ansible.builtin.systemd_service:
    name: pipewire.service
    scope: global
    enabled: true
  when: pipewire_alsa | bool or pipewire_pulse | bool or pipewire_jack | bool


- name: Enable PipeWire Pulse user service globally
  ansible.builtin.systemd_service:
    name: pipewire-pulse.service
    scope: global
    enabled: true
  when: pipewire_pulse | bool

- name: Install 32-bit PipeWire support
  ansible.builtin.package:
    name: lib32-pipewire
    state: present
  when: pipewire_alsa_32bit | bool


- name: Enable WirePlumber user service globally
  ansible.builtin.systemd_service:
    name: wireplumber.service
    scope: global
    enabled: true
  when: pipewire_wireplumber | bool


# ---------------------------------------------------------------------------
# DBus
# ---------------------------------------------------------------------------

- name: Gather service facts for DBus unit detection
  ansible.builtin.service_facts:
  when: dbus_enabled | bool

- name: Select DBus unit
  ansible.builtin.set_fact:
    dbus_unit_name: >-
      {{
        'dbus-broker.service'
        if 'dbus-broker.service' in (ansible_facts.services | default({}))
        else 'dbus.service'
      }}
  when: dbus_enabled | bool

- name: Validate DBus unit availability
  ansible.builtin.assert:
    that:
      - "'dbus.service' in (ansible_facts.services | default({})) or 'dbus-broker.service' in (ansible_facts.services | default({}))"
    fail_msg: >-
      No se encontró dbus.service ni dbus-broker.service en el sistema.
      Instala DBus o dbus-broker antes de continuar.
  when: dbus_enabled | bool

- name: Enable DBus service
  ansible.builtin.systemd_service:
    name: "{{ dbus_unit_name }}"
    enabled: true
    state: started
  when:
    - dbus_enabled | bool
    - dbus_unit_name in (ansible_facts.services | default({}))


# ---------------------------------------------------------------------------
# OpenRazer user service
# ---------------------------------------------------------------------------

- name: Enable OpenRazer user service globally
  ansible.builtin.systemd_service:
    name: openrazer-daemon.service
    scope: global
    enabled: true
  when: openrazer_enabled | bool


# ---------------------------------------------------------------------------
# Keyd
# ---------------------------------------------------------------------------

- name: Install keyd
  ansible.builtin.package:
    name: keyd
    state: present


- name: Configure keyd
  ansible.builtin.copy:
    dest: /etc/keyd/default.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [ids]
      *

      [main]
      capslock = esc
      esc = capslock
  notify:
    - Restart keyd


- name: Enable keyd
  ansible.builtin.systemd_service:
    name: keyd.service
    enabled: true
    state: started


# ---------------------------------------------------------------------------
# udev hwdb
# ---------------------------------------------------------------------------

- name: Configure Ideapad extra buttons
  ansible.builtin.copy:
    dest: /etc/udev/hwdb.d/90-ideapad-extra-buttons.hwdb
    owner: root
    group: root
    mode: "0644"
    content: |
      evdev:name:Ideapad extra buttons:*
        KEYBOARD_KEY_08=f20
        KEYBOARD_KEY_101=f21
        KEYBOARD_KEY_12d=f22

- name: Update udev hardware database
  ansible.builtin.command:
    cmd: systemd-hwdb update
  changed_when: false

- name: Reload udev devices
  ansible.builtin.command:
    cmd: udevadm trigger
  changed_when: false


# ---------------------------------------------------------------------------
# systemd rfkill
# ---------------------------------------------------------------------------

- name: Enable systemd-rfkill socket
  ansible.builtin.systemd_service:
    name: systemd-rfkill.socket
    enabled: true
    state: started


# ---------------------------------------------------------------------------
# Syncthing
# ---------------------------------------------------------------------------

- name: Create Syncthing data directory
  ansible.builtin.file:
    path: "{{ syncthing_data_dir }}"
    state: directory
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: "0755"


- name: Create Syncthing configuration directory
  ansible.builtin.file:
    path: "{{ syncthing_config_dir }}"
    state: directory
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: "0700"

- name: Enable lingering for Syncthing user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ syncthing_user }}"
  changed_when: false

- name: Get Syncthing user UID
  ansible.builtin.command:
    cmd: "id -u {{ syncthing_user }}"
  register: syncthing_uid_result
  changed_when: false

- name: Set Syncthing user UID
  ansible.builtin.set_fact:
    syncthing_uid: "{{ syncthing_uid_result.stdout }}"

- name: Enable Syncthing user service
  ansible.builtin.systemd:
    name: syncthing.service
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ syncthing_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ syncthing_uid }}"

# ---------------------------------------------------------------------------
# XDG portals
# ---------------------------------------------------------------------------

- name: Install XDG portal packages
  ansible.builtin.package:
    name:
      - xdg-desktop-portal
      - xdg-desktop-portal-hyprland
    state: present
  when:
    - xdg_portal_enabled | bool
    - xdg_portal_hyprland | bool


- name: Configure XDG portal backend
  ansible.builtin.file:
    path: /etc/xdg/xdg-desktop-portal
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - xdg_portal_enabled | bool
    - xdg_portal_hyprland | bool


- name: Prefer Hyprland portal backend
  ansible.builtin.copy:
    dest: /etc/xdg/xdg-desktop-portal/portals.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [preferred]
      default=hyprland
  when:
    - xdg_portal_enabled | bool
    - xdg_portal_hyprland | bool


# ---------------------------------------------------------------------------
# Hyprland / UWSM
# ---------------------------------------------------------------------------

- name: Install Hyprland
  ansible.builtin.package:
    name: hyprland
    state: present
  when: hyprland_enabled | bool


- name: Install UWSM
  ansible.builtin.package:
    name: uwsm
    state: present
  when:
    - hyprland_enabled | bool
    - uwsm_enabled | bool

- name: Install optional Xorg compatibility packages
  ansible.builtin.package:
    name:
      - xorg-server
      - xorg-xwayland
    state: present
  when: xorg_compat_enabled | bool


# ---------------------------------------------------------------------------
# greetd / Noctalia Greeter
# ---------------------------------------------------------------------------

- name: Install greetd
  ansible.builtin.package:
    name: greetd
    state: present
  when: greetd_enabled | bool


- name: Ensure greeter group exists
  ansible.builtin.group:
    name: "{{ greeter_group }}"
    system: true
    state: present
  when: greetd_enabled | bool


- name: Ensure greeter user exists
  ansible.builtin.user:
    name: "{{ greeter_user }}"
    group: "{{ greeter_group }}"
    groups:
      - video
      - render
      - input
    system: true
    create_home: false
    shell: /usr/bin/nologin
  when: greetd_enabled | bool


- name: Verify Noctalia Greeter is installed
  ansible.builtin.stat:
    path: /usr/bin/noctalia-greeter
  register: noctalia_greeter_binary

- name: Assert Noctalia Greeter is installed
  ansible.builtin.assert:
    that:
      - noctalia_greeter_binary.stat.exists
      - noctalia_greeter_binary.stat.executable
    fail_msg: >-
      /usr/bin/noctalia-greeter no está instalado.
      Instala Noctalia Greeter mediante tu gestor de paquetes/AUR.

- name: Create Noctalia Greeter state directory
  ansible.builtin.file:
    path: /var/lib/noctalia-greeter
    state: directory
    owner: "{{ greeter_user }}"
    group: "{{ greeter_group }}"
    mode: "0750"
  when: noctalia_greeter_enabled | bool


- name: Install Noctalia Greeter configuration
  ansible.builtin.copy:
    dest: /var/lib/noctalia-greeter/greeter.toml
    owner: "{{ greeter_user }}"
    group: "{{ greeter_group }}"
    mode: "0644"
    content: |
      [session]
      default = "Hyprland (uwsm-managed)"

      [cursor]
      theme = "{{ greeter_cursor_theme }}"
      size = {{ greeter_cursor_size }}
      path = "{{ greeter_cursor_path }}"

      [keyboard]
      layout = "{{ greeter_keyboard_layout }}"
      numlock = true
  when: noctalia_greeter_enabled | bool
  notify:
    - Restart greetd


- name: Configure greetd
  ansible.builtin.copy:
    dest: /etc/greetd/config.toml
    owner: root
    group: root
    mode: "0644"
    content: |
      [terminal]
      vt = 1

      [default_session]
      command = "env {% for env_var in greeter_environment | dict2items %}{{ env_var.key }}={{ env_var.value }} {% endfor %} /usr/bin/noctalia-greeter-session"
      user = "{{ greeter_user }}"
  when: noctalia_greeter_enabled | bool
  notify:
    - Restart greetd



- name: Enable greetd
  ansible.builtin.systemd_service:
    name: greetd.service
    enabled: true
    state: started
  when:
    - greetd_enabled | bool
    - noctalia_greeter_enabled | bool


# ---------------------------------------------------------------------------
# KDE Connect
# ---------------------------------------------------------------------------

- name: Install KDE Connect
  ansible.builtin.package:
    name: kdeconnect
    state: present
  when: kdeconnect_enabled | bool


# ---------------------------------------------------------------------------
# Steam
# ---------------------------------------------------------------------------

- name: Install Steam client
  ansible.builtin.package:
    name: steam
    state: present
  when: steam_enabled | bool


# ---------------------------------------------------------------------------
# Optional nwg-hello package (kept separate from active greeter)
# ---------------------------------------------------------------------------

- name: Install nwg-hello optionally
  ansible.builtin.package:
    name: nwg-hello
    state: present
  when: nwg_hello_enabled | bool

- name: Ensure nwg-hello configuration directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/nwg-hello
      mode: "0755"
    - path: /etc/nwg-hello/labwc
      mode: "0755"
  when: nwg_hello_enabled | bool

- name: Install nwg-hello configuration files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ nwg_hello_repo_path }}/labwc/autostart"
      dest: /etc/nwg-hello/labwc/autostart
      mode: "0755"
    - src: "{{ nwg_hello_repo_path }}/nwg-hello.json"
      dest: /etc/nwg-hello/nwg-hello.json
      mode: "0644"
    - src: "{{ nwg_hello_repo_path }}/nwg-hello.css"
      dest: /etc/nwg-hello/nwg-hello.css
      mode: "0644"
  when: nwg_hello_enabled | bool

- name: Check nwg-hello wallpaper source
  ansible.builtin.stat:
    path: "{{ nwg_hello_wallpaper_source }}"
  register: nwg_hello_wallpaper_stat
  when: nwg_hello_enabled | bool

- name: Validate nwg-hello wallpaper availability
  ansible.builtin.assert:
    that:
      - (not (nwg_hello_wallpaper_required | bool)) or nwg_hello_wallpaper_stat.stat.exists
    fail_msg: >-
      nwg_hello_enabled=true requiere un wallpaper válido.
      Define nwg_hello_wallpaper_source con una ruta existente
      o desactiva nwg_hello_wallpaper_required.
  when: nwg_hello_enabled | bool

- name: Install nwg-hello wallpaper
  ansible.builtin.copy:
    src: "{{ nwg_hello_wallpaper_source }}"
    dest: "{{ nwg_hello_wallpaper_target }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - nwg_hello_enabled | bool
    - nwg_hello_wallpaper_stat.stat.exists
