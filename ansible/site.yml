---
- name: Configure Arch system
  hosts: localhost
  become: true
  connection: local

  vars_files:
    - vars/main.yml

  tasks:
    - name: Import base system configuration
      ansible.builtin.import_tasks: tasks/base.yml

    - name: Import hardware configuration
      ansible.builtin.import_tasks: tasks/hardware.yml

    - name: Import networking configuration
      ansible.builtin.import_tasks: tasks/networking.yml

    - name: Import services configuration
      ansible.builtin.import_tasks: tasks/services.yml

    - name: Import security configuration
      ansible.builtin.import_tasks: tasks/security.yml

    - name: Import virtualization configuration
      ansible.builtin.import_tasks: tasks/virtualization.yml

    - name: Import optional AUR configuration
      ansible.builtin.import_tasks: tasks/aur.yml

  handlers:
    - name: Restart keyd
      ansible.builtin.systemd_service:
        name: keyd.service
        state: restarted

    - name: Reload udev
      ansible.builtin.command:
        cmd: udevadm trigger
      changed_when: false

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Rebuild initramfs
      ansible.builtin.command:
        cmd: mkinitcpio -P
      changed_when: true

    - name: Regenerate GRUB configuration
      ansible.builtin.command:
        cmd: grub-mkconfig -o /boot/grub/grub.cfg
      changed_when: true

    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables.service
        state: restarted

    - name: Restart NetworkManager
      ansible.builtin.systemd_service:
        name: NetworkManager.service
        state: restarted

    - name: Restart Avahi
      ansible.builtin.systemd_service:
        name: avahi-daemon.service
        state: restarted

    - name: Restart CUPS
      ansible.builtin.systemd_service:
        name: cups.service
        state: restarted

    - name: Restart greetd
      ansible.builtin.systemd_service:
        name: greetd.service
        state: restarted
