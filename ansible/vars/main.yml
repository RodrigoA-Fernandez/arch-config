---
# ---------------------------------------------------------------------------
# System
# ---------------------------------------------------------------------------

hostname: roderico
timezone: Europe/Madrid

locale: es_ES.UTF-8
console_keymap: es

multilib_enabled: true


# ---------------------------------------------------------------------------
# User
# ---------------------------------------------------------------------------

username: rodrigo
user_shell: /bin/zsh

user_groups:
  - wheel
  - wireshark
  - lp
  - scanner
  - kvm
  - openrazer
  - input
  - keyd
  - kvm

libvirt_group_name: libvirt

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------

networkmanager_enabled: true

# Added so the test VM can be administered over SSH.
# Set false for strict parity with the original NixOS config.
ssh_enabled: true

firewall_enabled: true

firewall_tcp_ports:
  - 1701
  - 5900
  - 53317
  - 22

firewall_udp_ports:
  - 1701
  - 1716
  - 53317

steam_remote_play_firewall_enabled: false
steam_remote_play_tcp_ports:
  - 27036
  - 27037
steam_remote_play_udp_ports:
  - 27031
  - 27036

steam_dedicated_server_firewall_enabled: false
steam_dedicated_server_tcp_ports:
  - 27015
  - 27030
steam_dedicated_server_udp_ports:
  - 27015


# ---------------------------------------------------------------------------
# Bluetooth
# ---------------------------------------------------------------------------

bluetooth_enabled: true
bluetooth_power_on_boot: true


# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------

openrazer_enabled: true
steam_devices_enabled: true
graphics_32bit: true
intel_microcode_enabled: true
rtkit_enabled: true


# ---------------------------------------------------------------------------
# NVIDIA
# ---------------------------------------------------------------------------

nvidia_enabled: true

nvidia_driver_package: nvidia-open

nvidia_modesetting: true
nvidia_fbdev: true
nvidia_power_management: true


# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------

initrd_kernel_modules:
  - i915

kernel_modules:
  - uinput

kernel_parameters:
  - quiet
  - intel_idle.max_cstate=1
  - pcie_aspm=off


# ---------------------------------------------------------------------------
# Boot
# ---------------------------------------------------------------------------

bootloader: grub
#Poner en true para la maquina real
grub_efi: false
grub_os_prober: true

# Local theme directory in the repository.
# HyperFluent is shipped in ansible/files/grub/hyperfluent.
grub_theme_enabled: true
grub_theme_source: "{{ playbook_dir }}/files/grub/hyperfluent"
grub_theme_destination: /boot/grub/themes/hyperfluent


# ---------------------------------------------------------------------------
# Plymouth
# ---------------------------------------------------------------------------

plymouth_enabled: true
plymouth_theme: spinner


# ---------------------------------------------------------------------------
# Desktop
# ---------------------------------------------------------------------------

hyprland_enabled: true
uwsm_enabled: true

xdg_portal_enabled: true
xdg_portal_hyprland: true
xorg_compat_enabled: false


# ---------------------------------------------------------------------------
# Greeter
# ---------------------------------------------------------------------------

greetd_enabled: true
noctalia_greeter_enabled: true

greeter_user: greeter
greeter_group: greeter

greeter_cursor_theme: Bibata-Modern-Ice
greeter_cursor_size: 24
greeter_cursor_path: /usr/share/icons
greeter_keyboard_layout: es

greeter_environment:
  WLR_DIRECT_SCANOUT_DISABLED: "1"


# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

syncthing_user: rodrigo
syncthing_data_dir: /home/rodrigo/Sync
syncthing_config_dir: /home/rodrigo/.config/syncthing
syncthing_enabled: true

printing_enabled: true

pipewire_alsa: true
pipewire_alsa_32bit: true
pipewire_pulse: true
pipewire_jack: true
pipewire_wireplumber: true
pulseaudio_compat_enabled: false

fwupd_enabled: true
power_profiles_enabled: true
kdeconnect_enabled: true
dbus_enabled: true

steam_enabled: true
nwg_hello_enabled: false
nwg_hello_repo_path: "{{ playbook_dir }}/../display/nwg-hello"
nwg_hello_wallpaper_source: "{{ nwg_hello_repo_path }}/wallpaper.jpg"
nwg_hello_wallpaper_target: /etc/nwg-hello/wallpaper.jpg
nwg_hello_wallpaper_required: true
nix_compat_enabled: false

official_packages:
  - neovim
  - kitty
  - wl-clipboard
  - cargo
  - rust
  - wine
  - alacritty
  - alsa-utils
  - direnv
  - pavucontrol
  - wireshark-qt
  - distrobox
  - loupe
  - wlr-randr
  - gstreamer
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-plugins-ugly
  - qt6-multimedia
  - syncthing

aur_install_enabled: true
aur_helper: yay
aur_required_packages:
  - noctalia-greeter
  - brlaser
  - libinput-gestures

aur_optional_packages:
  - open-scq30
  - polychromatic

nix_compat_aur_packages:
  - nix-direnv


# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

polkit_enabled: true
gnome_keyring_login: true


# ---------------------------------------------------------------------------
# Virtualization
# ---------------------------------------------------------------------------

libvirt_enabled: true
podman_enabled: true
podman_docker_compat: true
distrobox_alias_enabled: true
distrobox_alias: 'alias distrobox="XDG_DATA_DIRS=${GSETTINGS_SCHEMAS_PATH:+$GSETTINGS_SCHEMAS_PATH:}$XDG_DATA_DIRS distrobox_DIRS=${GSETTINGS_SCHEMAS_PATH:+$GSETTINGS_SCHEMAS_PATH:}$XDG_DATA_DIRS distrobox"'
